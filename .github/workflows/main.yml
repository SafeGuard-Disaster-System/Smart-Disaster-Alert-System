name: SafeGuard SACHET Feed Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: safeguard-sachet-state
  cancel-in-progress: false

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main project
        uses: actions/checkout@v4

      - name: Check out persistent state branch
        uses: actions/checkout@v4
        with:
          ref: safeguard-state
          path: state
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse SACHET disaster feed
        run: node scripts/sachet-check.js
