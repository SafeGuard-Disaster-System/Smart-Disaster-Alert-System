```yaml
name: SafeGuard SACHET Feed Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch SACHET disaster feed
        run: node -e "fetch('https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml').then(async r => { console.log('HTTP status:', r.status); if (!r.ok) throw new Error('Feed request failed'); const t = await r.text(); const n = (t.match(/<item(?:\s|>)/g) || []).length; console.log('Feed retrieved successfully'); console.log('RSS items found:', n); if (n === 0) throw new Error('No RSS items found; inspect the feed format'); }).catch(e => { console.error(e); process.exit(1); })"
```
