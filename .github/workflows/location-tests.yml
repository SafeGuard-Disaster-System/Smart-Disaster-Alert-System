
name: SafeGuard Location Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-location-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run location self-tests
        run: node scripts/sachet-check.js --test-location

      - name: Run synthetic CAP tests
        run: node scripts/sachet-check.js --test-cap
